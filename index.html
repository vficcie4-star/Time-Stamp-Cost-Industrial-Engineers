<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Journal & Stop Watch</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2196F3">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header with Time and Date -->
        <div class="header">
            <div class="time-date-container">
                <div id="currentTime" class="current-time">00:00:00</div>
                <div id="currentDate" class="current-date">01-JAN-2026</div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button id="clearHistoryBtn" class="btn btn-danger">Clear History</button>
            <button id="exportCSVBtn" class="btn btn-success">Export CSV</button>
        </div>

        <!-- Table Container -->
        <div class="table-container">
            <table id="journalTable">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Product</th>
                        <th>Process</th>
                        <th>Start Time</th>
                        <th>End Time</th>
                        <th>Paused Time</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Rows will be added here -->
                </tbody>
                <tfoot id="tableFooter">
                    <tr>
                        <td colspan="7" style="padding: 10px;">
                            <button id="addRowBtn" class="btn btn-primary add-bottom-btn">+ Add Time</button>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <!-- Modal for detailed form -->
    <div id="formModal" class="modal">
        <div class="modal-content form-modal">
            <div class="modal-header">
                <h3 id="formModalTitle">Entry Details</h3>
                <div class="modal-actions">
                    <button id="formCancelBtn" class="btn btn-danger btn-sm">Cancel</button>
                    <button id="formSaveBtn" class="btn btn-primary btn-sm">Save</button>
                </div>
            </div>
            <div class="modal-body">
                <form id="entryForm" class="entry-form">
                    <div class="form-group">
                        <label for="formSection">Section</label>
                        <input type="text" id="formSection" placeholder="Enter Section">
                    </div>
                    <div class="form-group">
                        <label for="formProduct">Product</label>
                        <input type="text" id="formProduct" placeholder="Enter Product">
                    </div>
                    <div class="form-group">
                        <label for="formSKU">SKU</label>
                        <input type="text" id="formSKU" placeholder="Enter SKU">
                    </div>
                    <div class="form-group">
                        <label for="formProcess">Process</label>
                        <textarea id="formProcess" rows="3" placeholder="Enter Process Details"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="formWorkUnit">Work Unit</label>
                        <input type="text" id="formWorkUnit" placeholder="Enter Work Unit">
                    </div>
                    <div class="form-group">
                        <label for="formOprt">Oprt</label>
                        <input type="text" id="formOprt" placeholder="Enter Oprt">
                    </div>
                    <div class="form-group">
                        <label for="formMTE">MTE</label>
                        <input type="text" id="formMTE" placeholder="Enter MTE">
                    </div>
                    <div class="form-group">
                        <label for="formRemarks">Remarks</label>
                        <textarea id="formRemarks" rows="3" placeholder="Enter Remarks"></textarea>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
